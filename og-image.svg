<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="807" cy="49" r="56" fill="#334155" opacity="0.05"/>
    <circle cx="1235" cy="351" r="55" fill="#334155" opacity="0.11"/>
    <circle cx="950" cy="-34" r="49" fill="#334155" opacity="0.19"/>
    <circle cx="24" cy="255" r="42" fill="#334155" opacity="0.14"/>
    <circle cx="101" cy="300" r="51" fill="#334155" opacity="0.12"/>
    <circle cx="1242" cy="181" r="26" fill="#334155" opacity="0.14"/>
    <rect x="945" y="568" width="59" height="26" rx="8" fill="#0f172a" opacity="0.10" transform="rotate(4, 1125, 368)"/>
    <rect x="940" y="422" width="51" height="20" rx="8" fill="#0f172a" opacity="0.13" transform="rotate(2, 221, 533)"/>
    <rect x="1027" y="329" width="59" height="91" rx="8" fill="#0f172a" opacity="0.04" transform="rotate(5, 879, 489)"/>
    <rect x="519" y="722" width="29" height="25" rx="8" fill="#0f172a" opacity="0.03" transform="rotate(9, 98, 296)"/>
    <rect x="-62" y="304" width="28" height="31" rx="8" fill="#0f172a" opacity="0.13" transform="rotate(6, 101, 474)"/>
    <rect x="655" y="292" width="74" height="53" rx="8" fill="#0f172a" opacity="0.07" transform="rotate(33, 761, 340)"/>
    <rect x="1035" y="689" width="44" height="60" rx="8" fill="#0f172a" opacity="0.06" transform="rotate(25, 708, 15)"/>
    <rect x="184" y="89" width="26" height="61" rx="8" fill="#0f172a" opacity="0.08" transform="rotate(18, 1175, 39)"/>
    <polygon points="554,675 593,753 515,753" fill="#334155" opacity="0.05"/>
    <polygon points="1096,343 1122,395 1070,395" fill="#334155" opacity="0.06"/>
    <polygon points="1054,-120 1151,74 957,74" fill="#334155" opacity="0.12"/>
    <polygon points="653,630 731,786 575,786" fill="#334155" opacity="0.13"/>

  <!-- Wave at bottom -->
  <path d="M0,572 C360,601 840,543 1200,572 L1200,630 L0,630Z" fill="#334155" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    연남 유흥 추천정보
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    연남 — 유흥
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#6366f1" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    연남 연남 유흥 추천정보 — 유흥
  </text>
</svg>